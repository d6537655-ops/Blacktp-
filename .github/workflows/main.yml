name: Build APK from ZIP

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip project
        run: |
          mkdir -p extracted
          unzip -q "BlackTP_final (5).zip" -d extracted

      - name: Fix missing import in Wheel.kt
        run: |
          WHEEL_FILE=$(find extracted -name "Wheel.kt" | head -n 1)
          if [ -n "$WHEEL_FILE" ]; then
            sed -i '0,/^import /s//import androidx.compose.ui.geometry.minDimension\nimport /' "$WHEEL_FILE"
            nl -ba "$WHEEL_FILE" | sed -n '1,45p'
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Find and Build APK
        run: |
          GRADLE_FILE=$(find extracted -name "build.gradle*" | head -n 1)
          PROJECT_DIR=$(dirname "$GRADLE_FILE")
          if [ -f "$PROJECT_DIR/../gradlew" ]; then
            PROJECT_DIR="$PROJECT_DIR/.."
          fi
          cd "$PROJECT_DIR"
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: "**/build/outputs/apk/**/*.apk"
          
          
