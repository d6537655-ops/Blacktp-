name: Build APK from ZIP

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip project
        run: |
          mkdir -p extracted
          unzip -q "BlackTP_final (5).zip" -d extracted

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Find and Build APK
        run: |
          GRADLE_FILE=$(find extracted -name "build.gradle*" | head -n 1)
          if [ -z "$GRADLE_FILE" ]; then
            echo "ОШИБКА: Внутри архива не найден Android-проект (нет файлов build.gradle)"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$GRADLE_FILE")
          if [ -f "$PROJECT_DIR/../gradlew" ]; then
            PROJECT_DIR="$PROJECT_DIR/.."
          fi
          cd "$PROJECT_DIR"
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug
          else
            gradle assembleDebug
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: "**/build/outputs/apk/**/*.apk"
          
